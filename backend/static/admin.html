<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 行业脉搏 - 管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .stat-card { transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-2px); }
        .concept-item { transition: all 0.2s; }
        .concept-item:hover { background: #f9fafb; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold text-gray-800">AI 行业脉搏 · 管理后台</h1>
            </div>
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-sm text-gray-600 hover:text-gray-800">返回前台</a>
                <div id="userInfo" class="text-sm text-gray-600"></div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- 核心指标 -->
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-8">
            <div class="stat-card bg-white rounded-xl p-6 shadow-sm border border-gray-200">
                <p class="text-sm text-gray-500">今日新增用户</p>
                <p class="text-3xl font-bold text-blue-600 mt-2" id="statNewUsers">-</p>
            </div>
            <div class="stat-card bg-white rounded-xl p-6 shadow-sm border border-gray-200">
                <p class="text-sm text-gray-500">今日抓取文章</p>
                <p class="text-3xl font-bold text-green-600 mt-2" id="statNewArticles">-</p>
            </div>
            <div class="stat-card bg-white rounded-xl p-6 shadow-sm border border-gray-200">
                <p class="text-sm text-gray-500">待处理反馈</p>
                <p class="text-3xl font-bold text-orange-600 mt-2" id="statPendingFeedback">-</p>
            </div>
            <div class="stat-card bg-white rounded-xl p-6 shadow-sm border border-gray-200">
                <p class="text-sm text-gray-500">VIP 用户数</p>
                <p class="text-3xl font-bold text-purple-600 mt-2" id="statVIPUsers">-</p>
            </div>
            <div class="stat-card bg-white rounded-xl p-6 shadow-sm border border-gray-200">
                <p class="text-sm text-gray-500">待审概念</p>
                <p class="text-3xl font-bold text-red-600 mt-2" id="statPendingConcepts">-</p>
            </div>
        </div>

        <!-- Tab 切换 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="flex border-b border-gray-200">
                <button class="tab-btn px-6 py-3 text-sm font-medium text-primary-600 border-b-2 border-primary-500" data-tab="pending">待审核</button>
                <button class="tab-btn px-6 py-3 text-sm font-medium text-gray-500 hover:text-gray-700" data-tab="active">已通过</button>
                <button class="tab-btn px-6 py-3 text-sm font-medium text-gray-500 hover:text-gray-700" data-tab="baseline">Baseline 对齐</button>
                <button class="tab-btn px-6 py-3 text-sm font-medium text-gray-500 hover:text-gray-700" data-tab="feedbacks">用户反馈</button>
            </div>

            <!-- 待审核列表 -->
            <div id="tab-pending" class="tab-content p-6">
                <div id="pendingList" class="space-y-3"></div>
            </div>

            <!-- 已通过列表 -->
            <div id="tab-active" class="tab-content p-6 hidden">
                <div id="activeList" class="space-y-3"></div>
            </div>

            <!-- Baseline 对齐列表 -->
            <div id="tab-baseline" class="tab-content p-6 hidden">
                <div id="baselineList" class="space-y-3"></div>
            </div>

            <!-- 用户反馈列表 -->
            <div id="tab-feedbacks" class="tab-content p-6 hidden">
                <div id="feedbackList" class="space-y-3"></div>
            </div>
        </div>
    </main>

    <!-- 对齐弹窗 -->
    <div id="alignModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
        <div class="absolute inset-0 bg-black/50" onclick="closeAlignModal()"></div>
        <div class="relative bg-white rounded-xl shadow-2xl w-full max-w-md p-6">
            <h3 class="text-lg font-bold mb-4">对齐国内等效产品</h3>
            <p class="text-sm text-gray-600 mb-2">概念：<span id="alignConceptName" class="font-medium"></span></p>
            <div id="alignSuggestions" class="mb-4"></div>
            <input type="text" id="customAlign" placeholder="或输入自定义对齐产品" class="w-full px-4 py-2 rounded-lg border border-gray-300 mb-4">
            <div class="flex gap-3">
                <button onclick="doAlign()" class="flex-1 py-2 bg-primary-500 text-white rounded-lg hover:bg-primary-600">确认对齐</button>
                <button onclick="closeAlignModal()" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">取消</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let currentConceptId = null;

        // 加载统计数据
        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/dashboard/stats`);
                const data = await res.json();
                document.getElementById('statNewUsers').textContent = data.today_new_users;
                document.getElementById('statNewArticles').textContent = data.today_new_articles;
                document.getElementById('statPendingFeedback').textContent = data.pending_feedbacks;
                document.getElementById('statVIPUsers').textContent = data.vip_users;
                document.getElementById('statPendingConcepts').textContent = data.pending_concepts;
            } catch (e) {
                console.error('Failed to load stats:', e);
            }
        }

        // 加载概念列表
        async function loadConcepts(status) {
            try {
                const res = await fetch(`${API_BASE}/api/admin/concepts/${status}`);
                const concepts = await res.json();
                const listId = status === 'pending' ? 'pendingList' : status === 'active' ? 'activeList' : 'baselineList';
                const container = document.getElementById(listId);

                if (concepts.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-center py-8">暂无数据</p>';
                    return;
                }

                container.innerHTML = concepts.map(c => `
                    <div class="concept-item flex items-center justify-between p-4 rounded-lg border border-gray-200">
                        <div class="flex-1">
                            <div class="flex items-center gap-2">
                                <span class="font-medium text-gray-800">${escapeHTML(c.name)}</span>
                                <span class="text-xs px-2 py-0.5 rounded-full ${c.status === 'baseline' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'}">
                                    ${c.status === 'baseline' ? 'Baseline' : c.status === 'active' ? '已通过' : '待审'}
                                </span>
                            </div>
                            <p class="text-sm text-gray-500 mt-1">${c.definition || '无描述'}</p>
                            <p class="text-xs text-gray-400 mt-1">热度: ${c.hot_score} | 置信度: ${(c.confidence * 100).toFixed(0)}%</p>
                        </div>
                        <div class="flex gap-2 ml-4">
                            ${status === 'pending' ? `
                                <button onclick="approveConcept(${c.id})" class="px-3 py-1.5 text-sm bg-green-500 text-white rounded-lg hover:bg-green-600">通过</button>
                                <button onclick="rejectConcept(${c.id})" class="px-3 py-1.5 text-sm bg-red-500 text-white rounded-lg hover:bg-red-600">拒绝</button>
                                <button onclick="openAlignModal(${c.id}, '${escapeHTML(c.name)}')" class="px-3 py-1.5 text-sm bg-purple-500 text-white rounded-lg hover:bg-purple-600">对齐</button>
                            ` : ''}
                            ${status === 'active' ? `
                                <button onclick="setBaseline(${c.id})" class="px-3 py-1.5 text-sm bg-purple-500 text-white rounded-lg hover:bg-purple-600">设为 Baseline</button>
                            ` : ''}
                            ${status === 'baseline' ? `
                                <button onclick="openAlignModal(${c.id}, '${escapeHTML(c.name)}')" class="px-3 py-1.5 text-sm bg-blue-500 text-white rounded-lg hover:bg-blue-600">修改对齐</button>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Failed to load concepts:', e);
            }
        }

        // 加载反馈列表
        async function loadFeedbacks() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/feedbacks`);
                const feedbacks = await res.json();
                const container = document.getElementById('feedbackList');

                if (feedbacks.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-center py-8">暂无反馈</p>';
                    return;
                }

                container.innerHTML = feedbacks.map(f => `
                    <div class="concept-item p-4 rounded-lg border border-gray-200">
                        <div class="flex items-start justify-between">
                            <div class="flex-1">
                                <div class="flex items-center gap-2">
                                    <span class="text-sm text-gray-600">${f.user_email || '匿名用户'}</span>
                                    <span class="text-xs px-2 py-0.5 rounded-full ${f.status === 'pending' ? 'bg-orange-100 text-orange-700' : 'bg-green-100 text-green-700'}">
                                        ${f.status === 'pending' ? '待处理' : '已处理'}
                                    </span>
                                </div>
                                <p class="text-gray-800 mt-2">${escapeHTML(f.content)}</p>
                                ${f.admin_reply ? `<p class="text-sm text-green-600 mt-2">回复: ${escapeHTML(f.admin_reply)}</p>` : ''}
                                <p class="text-xs text-gray-400 mt-2">${new Date(f.created_at).toLocaleString()}</p>
                            </div>
                            ${f.status === 'pending' ? `
                                <div class="flex gap-2 ml-4">
                                    <button onclick="resolveFeedback(${f.id})" class="px-3 py-1.5 text-sm bg-green-500 text-white rounded-lg hover:bg-green-600">已处理</button>
                                    <button onclick="dismissFeedback(${f.id})" class="px-3 py-1.5 text-sm bg-gray-500 text-white rounded-lg hover:bg-gray-600">忽略</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Failed to load feedbacks:', e);
            }
        }

        // 概念操作
        async function approveConcept(id) {
            await fetch(`${API_BASE}/api/admin/concepts/${id}/approve`, { method: 'POST' });
            loadConcepts('pending');
            loadStats();
        }

        async function rejectConcept(id) {
            await fetch(`${API_BASE}/api/admin/concepts/${id}/reject`, { method: 'POST' });
            loadConcepts('pending');
        }

        async function setBaseline(id) {
            await fetch(`${API_BASE}/api/admin/concepts/${id}/baseline`, { method: 'POST' });
            loadConcepts('active');
            loadConcepts('baseline');
        }

        async function openAlignModal(id, name) {
            currentConceptId = id;
            document.getElementById('alignConceptName').textContent = name;
            document.getElementById('alignModal').classList.remove('hidden');

            // 获取建议的对齐产品
            try {
                const res = await fetch(`${API_BASE}/api/admin/concepts/${id}/suggest-alignment`);
                const data = await res.json();
                const suggestions = data.suggestions || [];
                document.getElementById('alignSuggestions').innerHTML = suggestions.length > 0
                    ? `<p class="text-sm text-gray-600 mb-2">建议对齐到：</p>` + suggestions.map(s =>
                        `<button onclick="selectSuggestion('${s}')" class="inline-block px-3 py-1 mr-2 mb-2 text-sm bg-blue-100 text-blue-700 rounded-full hover:bg-blue-200">${s}</button>`
                    ).join('')
                    : '<p class="text-sm text-gray-400">无预设建议，可手动输入</p>';
            } catch (e) {
                document.getElementById('alignSuggestions').innerHTML = '<p class="text-sm text-gray-400">加载建议失败</p>';
            }
        }

        function closeAlignModal() {
            document.getElementById('alignModal').classList.add('hidden');
            document.getElementById('customAlign').value = '';
        }

        function selectSuggestion(value) {
            document.getElementById('customAlign').value = value;
        }

        async function doAlign() {
            const value = document.getElementById('customAlign').value.trim();
            if (!value) return alert('请输入对齐产品');
            await fetch(`${API_BASE}/api/admin/concepts/${currentConceptId}/align`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chinese_equivalent: value })
            });
            closeAlignModal();
            loadConcepts('pending');
            loadConcepts('baseline');
        }

        // 反馈操作
        async function resolveFeedback(id) {
            await fetch(`${API_BASE}/api/admin/feedbacks/${id}/resolve`, { method: 'POST' });
            loadFeedbacks();
            loadStats();
        }

        async function dismissFeedback(id) {
            await fetch(`${API_BASE}/api/admin/feedbacks/${id}/dismiss`, { method: 'POST' });
            loadFeedbacks();
        }

        // Tab 切换
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('text-primary-600', 'border-b-2', 'border-primary-500');
                    b.classList.add('text-gray-500');
                });
                btn.classList.add('text-primary-600', 'border-b-2', 'border-primary-500');
                btn.classList.remove('text-gray-500');

                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                document.getElementById(`tab-${btn.dataset.tab}`).classList.remove('hidden');

                const tab = btn.dataset.tab;
                if (tab === 'pending') loadConcepts('pending');
                else if (tab === 'active') loadConcepts('active');
                else if (tab === 'baseline') loadConcepts('baseline');
                else if (tab === 'feedbacks') loadFeedbacks();
            });
        });

        // HTML 转义
        function escapeHTML(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // 初始化
        loadStats();
        loadConcepts('pending');
    </script>
</body>
</html>
