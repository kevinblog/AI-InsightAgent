# Render 部署配置
services:
  - type: web
    name: ai-pulse
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_SQLITE
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
