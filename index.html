                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                </svg>
                                ${formatNumber(concept.views)}
                            </span>
                            <span class="flex items-center gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                                </svg>
                                ${concept.likes}
                            </span>
                        </div>
                        ${concept.hot ? '<span class="text-xs px-2 py-1 rounded-full bg-red-100 text-red-600 flex items-center gap-1"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg> 热门</span>' : ''}
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        function renderNews(news) {
            const container = document.getElementById('newsFeed');
            container.innerHTML = '';
            
            news.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'bg-white/70 backdrop-blur-md rounded-xl overflow-hidden shadow-lg card-hover border border-white/50 flex';
                card.style.animation = `slideUp 0.5s ease-out ${index * 0.15 + 0.3}s both`;
                
                card.innerHTML = `
                    <div class="w-32 flex-shrink-0">
                        <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover" />
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <h3 class="font-medium text-gray-800 line-clamp-2">${item.title}</h3>
                        <div class="flex items-center justify-between text-sm text-gray-500">
                            <span>${item.source}</span>
                            <span>${item.date}</span>
                            <span class="text-xs px-2 py-0.5 rounded-full bg-primary-100 text-primary-600">${item.category}</span>
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderConcepts(mockConcepts);
            renderNews(mockNews);

            const filterTags = document.querySelectorAll('.filter-tag');
            filterTags.forEach(tag => {
                tag.addEventListener('click', () => {
                    filterTags.forEach(t => t.classList.remove('tag-active', 'text-white'));
                    tag.classList.add('tag-active', 'text-white');
                    
                    const category = tag.textContent;
                    if (category === '全部') {
                        renderConcepts(mockConcepts);
                    } else {
                        const filtered = mockConcepts.filter(c => c.category === category);
                        renderConcepts(filtered);
                    }
                });
            });

            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                if (!query) {
                    renderConcepts(mockConcepts);
                    filterTags[0].click();
                    return;
                }
                
                const filtered = mockConcepts.filter(c => 
                    c.title.toLowerCase().includes(query) ||
                    c.definition.toLowerCase().includes(query) ||
                    c.tags.some(t => t.toLowerCase().includes(query))
                );
                renderConcepts(filtered);
            });

            document.getElementById('clearFilter').addEventListener('click', () => {
                filterTags[0].click();
                searchInput.value = '';
            });

            document.addEventListener('click', (e) => {
                if (e.target.closest('.save-btn')) {
                    const btn = e.target.closest('.save-btn');
                    const id = parseInt(btn.dataset.id);
                    const concept = mockConcepts.find(c => c.id === id);
                    if (concept) {
                        concept.saved = !concept.saved;
                        const icon = btn.querySelector('svg');
                        if (concept.saved) {
                            icon.classList.add('text-yellow-500', 'fill-yellow-500');
                        } else {
                            icon.classList.remove('text-yellow-500', 'fill-yellow-500');
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
