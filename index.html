                        <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 300ms"></span>
                    </div>
                </div>
            `;
            messagesContainer.appendChild(botMessage);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            setTimeout(() => {
                const response = aiAnswers[Object.keys(aiAnswers).find(key => message.includes(key))] || 
                    `${aiResponses[Math.floor(Math.random() * aiResponses.length)]}

这篇文章主要讨论了 ${document.getElementById('modalCategory').textContent} 领域的最新发展。根据文章内容，核心要点包括：

1. 技术创新：文章介绍了该领域的最新技术突破和发展趋势
2. 应用场景：讨论了相关技术在实际业务中的应用
3. 未来展望：分析了该领域的发展方向和潜在机遇

如果您有更具体的问题，欢迎继续提问！`;

                botMessage.innerHTML = `
                    <div class="w-7 h-7 rounded-full bg-gradient-to-br from-primary-500 to-accent-500 flex items-center justify-center flex-shrink-0">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                        </svg>
                    </div>
                    <div class="bg-white rounded-xl p-3 shadow-sm">
                        <p class="text-sm text-gray-700">${response}</p>
                    </div>
                `;
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 1500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderNewsList(mockArticles);
            renderConcepts(mockConcepts);

            document.addEventListener('click', (e) => {
                const articleItem = e.target.closest('.article-item');
                if (articleItem) {
                    const id = parseInt(articleItem.dataset.id);
                    openArticleModal(id);
                }

                if (e.target.closest('#closeModal') || e.target.closest('#modalOverlay')) {
                    closeModal();
                }

                const saveBtn = e.target.closest('.save-concept-btn');
                if (saveBtn) {
                    const id = parseInt(saveBtn.dataset.id);
                    const concept = mockConcepts.find(c => c.id === id);
                    if (concept) {
                        concept.saved = !concept.saved;
                        const icon = saveBtn.querySelector('svg');
                        if (concept.saved) {
                            icon.classList.add('text-yellow-500', 'fill-yellow-500');
                        } else {
                            icon.classList.remove('text-yellow-500', 'fill-yellow-500');
                        }
                    }
                }
            });

            document.getElementById('sendMessage').addEventListener('click', sendMessage);
            document.getElementById('chatInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });

            const filterTags = document.querySelectorAll('.filter-tag');
            filterTags.forEach(tag => {
                tag.addEventListener('click', () => {
                    filterTags.forEach(t => {
                        t.classList.remove('tag-active', 'text-white', 'bg-gradient-to-r', 'from-primary-500', 'to-accent-500');
                        t.classList.add('bg-gray-100', 'text-gray-600');
                    });
                    tag.classList.remove('bg-gray-100', 'text-gray-600');
                    tag.classList.add('tag-active', 'text-white', 'bg-gradient-to-r', 'from-primary-500', 'to-accent-500');
                    
                    renderConcepts(mockConcepts, tag.textContent);
                });
            });
        });
    </script>
</body>
</html>
